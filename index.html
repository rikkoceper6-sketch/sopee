<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetStore Pro - Login Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Warna latar belakang disesuaikan ke gradasi yang jauh lebih gelap */
            background: linear-gradient(-45deg, #030712, #090d16, #0f172a, #050811);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Ambient Orbs dibuat lebih redup dan reduksi opasitas */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            animation: float 8s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 320px;
            height: 320px;
            background: #0284c7;
            top: 10%;
            left: 15%;
        }

        .orb-2 {
            width: 280px;
            height: 280px;
            background: #3b82f6;
            bottom: 10%;
            right: 15%;
            animation-delay: -4s;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-30px) scale(1.1); }
        }

        /* Card Container dengan tema gelap pekat (Glassmorphism Dark) */
        .login-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px;
            width: 420px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            text-align: center;
            color: #f8fafc;
            position: relative;
            z-index: 10;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
            background: linear-gradient(to right, #f8fafc, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-card p {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        /* Selector Role Gelap */
        .role-selector {
            display: flex;
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 5px;
            margin-bottom: 25px;
        }

        .role-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #64748b;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .role-btn.active {
            background: linear-gradient(135deg, #0284c7, #1d4ed8);
            color: #fff;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        /* Dynamic Form Control */
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #cbd5e1;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(3, 7, 18, 0.5);
            color: #f8fafc;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #38bdf8;
            background: rgba(3, 7, 18, 0.8);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
        }

        .form-group input::placeholder {
            color: #475569;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #0284c7, #1d4ed8);
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.5);
            background: linear-gradient(135deg, #0369a1, #1e40af);
        }

        .hint {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="login-card">
        <h1>GadgetStore Pro</h1>
        <p>Silakan pilih peran untuk masuk ke sistem</p>

        <div class="role-selector">
            <button class="role-btn active" id="btnRolePembeli" onclick="setRole('pembeli')">Pembeli</button>
            <button class="role-btn" id="btnRoleAdmin" onclick="setRole('admin')">Administrator</button>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <!-- Dynamic Form Content -->
            <div id="adminFields" style="display: none;">
                <div class="form-group">
                    <label for="username">Username Admin</label>
                    <input type="text" id="username" placeholder="Masukkan username (admin)">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Masukkan password (12345)">
                </div>
            </div>

            <div id="pembeliFields">
                <div class="form-group">
                    <label for="namaPembeli">Nama Lengkap</label>
                    <input type="text" id="namaPembeli" placeholder="Masukkan nama Anda (Opsional)">
                </div>
            </div>

            <button type="submit" class="btn-login" id="submitBtn">Masuk Sebagai Pembeli</button>
        </form>

        <div class="hint" id="loginHint">
            Mode Pembeli: Bebas masuk tanpa password.
        </div>
    </div>

    <script>
        let currentRole = 'pembeli';

        function setRole(role) {
            currentRole = role;
            const btnPembeli = document.getElementById('btnRolePembeli');
            const btnAdmin = document.getElementById('btnRoleAdmin');
            const adminFields = document.getElementById('adminFields');
            const pembeliFields = document.getElementById('pembeliFields');
            const submitBtn = document.getElementById('submitBtn');
            const loginHint = document.getElementById('loginHint');

            if (role === 'admin') {
                btnAdmin.classList.add('active');
                btnPembeli.classList.remove('active');
                adminFields.style.display = 'block';
                pembeliFields.style.display = 'none';
                submitBtn.innerText = 'Masuk Sebagai Admin';
                loginHint.innerText = 'Login Admin default: Username "admin" | Password "12345"';
            } else {
                btnPembeli.classList.add('active');
                btnAdmin.classList.remove('active');
                adminFields.style.display = 'none';
                pembeliFields.style.display = 'block';
                submitBtn.innerText = 'Masuk Sebagai Pembeli';
                loginHint.innerText = 'Mode Pembeli: Bebas masuk tanpa password.';
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            if (currentRole === 'admin') {
                const u = document.getElementById('username').value;
                const p = document.getElementById('password').value;

                if (u === 'admin' && p === '12345') {
                    alert('Login Admin Berhasil!');
                    window.location.href = 'admin.html';
                } else {
                    alert('Username atau password Admin salah! (Gunakan admin/12345)');
                }
            } else {
                const nama = document.getElementById('namaPembeli').value || 'Pelanggan';
                localStorage.setItem('buyerName', nama);
                window.location.href = 'pembeli.html';
            }
        }
    </script>
</body>
</html>
