<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetStore Pro - Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6366f1;
            --accent: #06b6d4;
            --bg-dark: #090d16;
            --card-bg: rgba(18, 24, 38, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.12) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-light);
            padding: 12px;
        }

        header {
            background: rgba(30, 27, 75, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 14px 18px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .admin-badge {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            font-size: 0.65rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .btn-logout {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        @media (min-width: 768px) {
            .container {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 18px;
            border: 1px solid var(--card-border);
        }

        .card h2 {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 14px;
            color: var(--accent);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(11, 15, 25, 0.7);
            color: #fff;
            outline: none;
            font-size: 0.85rem;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-cancel {
            width: 100%;
            padding: 10px;
            background: rgba(100, 116, 139, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 0.85rem;
            margin-top: 8px;
            display: none;
            cursor: pointer;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-box {
            background: rgba(11, 15, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 14px;
            border-radius: 12px;
            text-align: center;
        }

        .product-list-admin {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
        }

        .product-item-admin {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(11, 15, 25, 0.6);
            padding: 10px;
            border-radius: 10px;
        }

        .product-item-admin img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 6px;
        }

        .product-item-admin .info { flex: 1; }

        .btn-edit, .btn-delete {
            border: none;
            padding: 5px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.7rem;
            color: #fff;
        }

        .btn-edit { background: var(--warning); }
        .btn-delete { background: var(--danger); }

        /* STYLING TABEL DENGAN KOLOM PEMBELI & PENERIMA BERSAMPINGAN */
        .order-table-wrapper {
            width: 100%;
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .order-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        .order-table th, .order-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 0.78rem;
            vertical-align: top;
        }

        .order-table th {
            color: var(--accent);
            background: rgba(11, 15, 25, 0.9);
            font-weight: 700;
            text-transform: uppercase;
        }

        .buyer-tag {
            color: #38bdf8;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .recipient-tag {
            color: #f43f5e;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .sub-details {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 4px;
            line-height: 1.4;
        }

        .status-select {
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(11, 15, 25, 0.9);
            color: #38bdf8;
            border: 1px solid var(--primary);
            font-size: 0.72rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ GadgetStore <span class="admin-badge">Admin</span></h1>
        <button class="btn-logout" onclick="window.location.href='index.html'">Logout</button>
    </header>

    <div class="container">
        
        <!-- Form Tambah / Edit Produk -->
        <div class="card">
            <h2 id="formTitle">➕ Tambah Produk Baru</h2>
            <form id="productForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="editProductId">
                
                <div class="form-group">
                    <label for="nama">Nama Produk</label>
                    <input type="text" id="nama" placeholder="Contoh: iPad Pro M2" required>
                </div>
                
                <div class="form-group">
                    <label for="harga">Harga Produk (Rp)</label>
                    <input type="number" id="harga" placeholder="15000000" required>
                </div>
                
                <div class="form-group">
                    <label for="deskripsi">Deskripsi</label>
                    <textarea id="deskripsi" rows="2" placeholder="Spesifikasi Produk" required></textarea>
                </div>
                
                <div class="form-group">
                    <label>Gambar Produk (URL / File)</label>
                    <input type="text" id="gambarUrl" placeholder="Link Gambar">
                    <input type="file" id="gambarFile" accept="image/*" onchange="convertFileToBase64('gambarFile', 'gambarUrl')" style="margin-top:5px; font-size:0.75rem;">
                </div>

                <div class="form-group">
                    <label>Video Demo (URL Youtube / File)</label>
                    <input type="text" id="ytVideoUrl" placeholder="Link Embed / YouTube">
                    <input type="file" id="ytVideoFile" accept="video/*" onchange="convertFileToBase64('ytVideoFile', 'ytVideoUrl')" style="margin-top:5px; font-size:0.75rem;">
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">Simpan Produk</button>
                <button type="button" class="btn-cancel" id="btnCancel" onclick="resetForm()">Batal Edit</button>
            </form>
        </div>

        <!-- Dashboard Analytics -->
        <div class="card">
            <h2>📊 Analytics & Inventaris</h2>
            <div class="stats-grid">
                <div class="stat-box">
                    <p style="font-size:0.7rem; color:var(--text-muted);">TOTAL PRODUK</p>
                    <h3 id="totalProductsCount" style="color:#38bdf8; font-size:1.4rem;">0</h3>
                </div>
                <div class="stat-box">
                    <p style="font-size:0.7rem; color:var(--text-muted);">TOTAL PESANAN</p>
                    <h3 id="totalOrdersCount" style="color:#ec4899; font-size:1.4rem;">0</h3>
                </div>
            </div>

            <h2>📦 Daftar Produk Aktif</h2>
            <div class="product-list-admin" id="productListAdmin"></div>
        </div>

        <!-- Tabel Pesanan: Kolom Pembeli dan Penerima Terpisah Berdampingan -->
        <div class="card" style="grid-column: 1 / -1;">
            <h2>🚚 Kelola Transaksi & Pengiriman</h2>
            <div class="order-table-wrapper">
                <table class="order-table">
                    <thead>
                        <tr>
                            <th>ID Pesanan</th>
                            <th>🛒 Pembeli</th>
                            <th>🎁 Penerima</th>
                            <th>Detail Barang</th>
                            <th>Total & Bayar</th>
                            <th>Status Pengiriman</th>
                        </tr>
                    </thead>
                    <tbody id="adminOrdersBody"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        function convertFileToBase64(fileInputId, targetUrlInputId) {
            const fileInput = document.getElementById(fileInputId);
            const targetInput = document.getElementById(targetUrlInputId);
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { targetInput.value = e.target.result; };
                reader.readAsDataURL(fileInput.files[0]);
            }
        }

        let products = JSON.parse(localStorage.getItem('gadgetProducts')) || [
            { id: 1, nama: "Smartphone Premium X", harga: 12000000, deskripsi: "RAM 12GB, AMOLED 120Hz", gambar: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500", ytVideo: "" }
        ];

        let orders = JSON.parse(localStorage.getItem('gadgetOrders')) || [];

        function renderAdminProducts() {
            const container = document.getElementById('productListAdmin');
            document.getElementById('totalProductsCount').innerText = products.length;
            container.innerHTML = '';

            products.forEach((p, index) => {
                const item = document.createElement('div');
                item.className = 'product-item-admin';
                item.innerHTML = `
                    <img src="${p.gambar}" alt="${p.nama}">
                    <div class="info">
                        <strong style="font-size:0.85rem;">${p.nama}</strong>
                        <p style="color:#10b981; font-size:0.75rem;">Rp ${Number(p.harga).toLocaleString('id-ID')}</p>
                    </div>
                    <div>
                        <button class="btn-edit" onclick="editProduct(${p.id})">Edit</button>
                        <button class="btn-delete" onclick="deleteProduct(${index})">Hapus</button>
                    </div>
                `;
                container.appendChild(item);
            });
            localStorage.setItem('gadgetProducts', JSON.stringify(products));
        }

        function renderAdminOrders() {
            const tbody = document.getElementById('adminOrdersBody');
            document.getElementById('totalOrdersCount').innerText = orders.length;
            tbody.innerHTML = '';

            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#94a3b8; padding:20px;">Belum ada pesanan masuk.</td></tr>`;
                return;
            }

            orders.forEach((ord, index) => {
                const itemsSummary = ord.items.map(i => `${i.nama} (${i.qty}x)`).join(', ');
                const buyerName = ord.buyerName || 'Anonim';
                const recipientName = ord.recipientName || buyerName; 
                const phone = ord.phone || '-';
                const address = ord.address || '-';
                const pMethod = ord.paymentMethod || 'COD';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>#${ord.id}</strong><br><small style="color:#94a3b8;">${ord.date}</small></td>
                    <td>
                        <div class="buyer-tag">👤 ${buyerName}</div>
                    </td>
                    <td>
                        <div class="recipient-tag">🎁 ${recipientName}</div>
                        <div class="sub-details">
                            📞 ${phone}<br>
                            📍 ${address}
                        </div>
                    </td>
                    <td>${itemsSummary}</td>
                    <td>
                        <strong style="color:#10b981;">Rp ${Number(ord.total).toLocaleString('id-ID')}</strong><br>
                        <small style="color:#818cf8;">💳 ${pMethod}</small>
                    </td>
                    <td>
                        <select class="status-select" onchange="updateOrderStatus(${index}, this.value)">
                            <option value="Sedang Diproses" ${ord.status === 'Sedang Diproses' ? 'selected' : ''}>⏳ Diproses</option>
                            <option value="Dalam Perjalanan" ${ord.status === 'Dalam Perjalanan' ? 'selected' : ''}>🚚 Perjalanan</option>
                            <option value="Sudah Sampai" ${ord.status === 'Sudah Sampai' ? 'selected' : ''}>✅ Sampai</option>
                            <option value="Selesai" ${ord.status === 'Selesai' ? 'selected' : ''}>🎉 Selesai</option>
                        </select>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateOrderStatus(index, newStatus) {
            orders[index].status = newStatus;
            localStorage.setItem('gadgetOrders', JSON.stringify(orders));
            alert(`Status pesanan #${orders[index].id} diubah ke ${newStatus}`);
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editProductId').value;
            const productData = {
                id: editId ? Number(editId) : Date.now(),
                nama: document.getElementById('nama').value,
                harga: Number(document.getElementById('harga').value),
                deskripsi: document.getElementById('deskripsi').value,
                gambar: document.getElementById('gambarUrl').value || 'https://via.placeholder.com/300',
                ytVideo: document.getElementById('ytVideoUrl').value
            };

            if (editId) {
                const idx = products.findIndex(p => p.id === Number(editId));
                if (idx !== -1) products[idx] = productData;
            } else {
                products.push(productData);
            }

            renderAdminProducts();
            resetForm();
        }

        function editProduct(id) {
            const prod = products.find(p => p.id === id);
            if (!prod) return;
            document.getElementById('editProductId').value = prod.id;
            document.getElementById('nama').value = prod.nama;
            document.getElementById('harga').value = prod.harga;
            document.getElementById('deskripsi').value = prod.deskripsi;
            document.getElementById('gambarUrl').value = prod.gambar;
            document.getElementById('ytVideoUrl').value = prod.ytVideo;
            document.getElementById('formTitle').innerText = '✏️ Edit Produk';
            document.getElementById('btnSubmit').innerText = 'Update Produk';
            document.getElementById('btnCancel').style.display = 'block';
        }

        function resetForm() {
            document.getElementById('productForm').reset();
            document.getElementById('editProductId').value = '';
            document.getElementById('formTitle').innerText = '➕ Tambah Produk Baru';
            document.getElementById('btnSubmit').innerText = 'Simpan Produk';
            document.getElementById('btnCancel').style.display = 'none';
        }

        function deleteProduct(index) {
            if(confirm('Hapus produk ini?')) {
                products.splice(index, 1);
                renderAdminProducts();
            }
        }

        renderAdminProducts();
        renderAdminOrders();
    </script>
</body>
</html>
