<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetStore Pro - Admin Panel</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #1d4ed8;
            --accent: #06b6d4;
            --bg-dark: #030712;
            --card-bg: rgba(15, 23, 42, 0.75);
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(3, 7, 18, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #030712, #090d16, #0f172a, #050811);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Animated Header Dark */
        header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            padding: 20px 30px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        header h1 {
            font-size: 1.6rem;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(to right, #f8fafc, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .admin-badge {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-text-fill-color: #fff;
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
        }

        /* Tombol Logout Neon Danger */
        .btn-logout {
            background: linear-gradient(135deg, #dc2626, #991b1b);
            color: #fff;
            border: 1px solid rgba(248, 113, 113, 0.3);
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.3);
        }

        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(220, 38, 38, 0.6);
            background: linear-gradient(135deg, #ef4444, #b91c1c);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* Glassmorphism Dark Cards */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            transition: border-color 0.3s ease;
        }

        .card:hover {
            border-color: rgba(56, 189, 248, 0.3);
        }

        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 20px;
            color: #38bdf8;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #cbd5e1;
        }

        .form-group input[type="text"], 
        .form-group input[type="number"], 
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 11px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: #f8fafc;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
            background: rgba(3, 7, 18, 0.8);
        }

        .form-group input::placeholder, .form-group textarea::placeholder {
            color: #475569;
        }

        /* Sub-option Tab (Upload vs URL) */
        .input-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }

        .toggle-btn {
            padding: 4px 10px;
            font-size: 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .toggle-btn.active {
            background: #0284c7;
            color: #fff;
            border-color: #38bdf8;
        }

        .file-input {
            padding: 8px !important;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* Style Tombol Aksi */
        .btn-action {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit {
            background: linear-gradient(135deg, #0284c7, #1d4ed8);
            color: #fff;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.5);
            background: linear-gradient(135deg, #0369a1, #1e40af);
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            margin-top: 8px;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        /* Stats Grid Dark */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: rgba(3, 7, 18, 0.6);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .stat-box h3 {
            font-size: 1.6rem;
            color: #38bdf8;
            margin-top: 4px;
        }

        .stat-box p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Inventory List Dark */
        .product-list-admin {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 440px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .product-list-admin::-webkit-scrollbar {
            width: 6px;
        }

        .product-list-admin::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .product-item-admin {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(3, 7, 18, 0.5);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .product-item-admin:hover {
            background: rgba(3, 7, 18, 0.8);
            border-color: rgba(56, 189, 248, 0.2);
        }

        .product-item-admin img, .product-item-admin video {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #000;
        }

        .product-item-admin .info {
            flex: 1;
        }

        .product-item-admin .info h4 {
            font-size: 0.95rem;
            color: #f1f5f9;
        }

        .product-item-admin .info p {
            font-size: 0.85rem;
            color: #10b981;
            font-weight: 700;
            margin-top: 2px;
        }

        .action-btns {
            display: flex;
            gap: 6px;
        }

        .btn-edit {
            background: linear-gradient(135deg, #d97706, #b45309);
            color: #fff;
            border: none;
            padding: 7px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(217, 119, 6, 0.3);
        }

        .btn-edit:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        .btn-delete {
            background: linear-gradient(135deg, #dc2626, #991b1b);
            color: #fff;
            border: none;
            padding: 7px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(220, 38, 38, 0.3);
        }

        .btn-delete:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .badge-edit-mode {
            background: #d97706;
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ GadgetStore Pro <span class="admin-badge">Admin System</span></h1>
        <button class="btn-logout" onclick="window.location.href='index.html'">Logout</button>
    </header>

    <div class="container">
        
        <!-- Form Tambah / Edit Produk -->
        <div class="card">
            <h2 id="formTitle">
                <span>➕ Tambah Produk Baru</span>
                <span id="editBadge" class="badge-edit-mode" style="display: none;">Mode Edit</span>
            </h2>
            <form id="addProductForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="editProductId">

                <div class="form-group">
                    <label for="nama">Nama Produk</label>
                    <input type="text" id="nama" placeholder="Contoh: iPad Pro M2" required>
                </div>

                <div class="form-group">
                    <label for="harga">Harga Produk (Rp)</label>
                    <input type="number" id="harga" placeholder="15000000" required>
                </div>

                <div class="form-group">
                    <label for="deskripsi">Deskripsi & Spesifikasi Singkat</label>
                    <textarea id="deskripsi" rows="3" placeholder="Layar 120Hz, RAM 16GB, Chipset M2" required></textarea>
                </div>

                <!-- Opsi Sumber Gambar (URL / Upload File) -->
                <div class="form-group">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 6px;">
                        <label style="margin:0;">Gambar Produk</label>
                        <div class="input-toggle">
                            <button type="button" class="toggle-btn active" id="btnImgUrl" onclick="switchImgInput('url')">Link URL</button>
                            <button type="button" class="toggle-btn" id="btnImgFile" onclick="switchImgInput('file')">Upload File</button>
                        </div>
                    </div>
                    <input type="text" id="gambarUrl" placeholder="https://images.unsplash.com/photo-...">
                    <input type="file" id="gambarFile" class="file-input" accept="image/*" style="display: none;">
                </div>

                <!-- Opsi Sumber Video (YouTube / Upload File Lokal) -->
                <div class="form-group">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 6px;">
                        <label style="margin:0;">Video Demo Produk</label>
                        <div class="input-toggle">
                            <button type="button" class="toggle-btn active" id="btnVidYt" onclick="switchVidInput('yt')">Link YouTube</button>
                            <button type="button" class="toggle-btn" id="btnVidFile" onclick="switchVidInput('file')">Upload MP4</button>
                        </div>
                    </div>
                    <input type="text" id="ytVideo" placeholder="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
                    <input type="file" id="videoFile" class="file-input" accept="video/*" style="display: none;">
                </div>

                <button type="submit" class="btn-action btn-submit" id="submitBtn">
                    💾 Simpan Produk ke Database
                </button>
                <button type="button" class="btn-action btn-cancel" id="cancelEditBtn" style="display: none;" onclick="resetFormState()">
                    ✖ Batal Edit
                </button>
            </form>
        </div>

        <!-- Dashboard Analytics & Daftar Inventaris -->
        <div class="card">
            <h2>📊 Analytics & Inventaris Saat Ini</h2>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <p>Total Produk</p>
                    <h3 id="totalProductsCount">0</h3>
                </div>
                <div class="stat-box">
                    <p>Status Server</p>
                    <h3 style="color:#10b981;">ONLINE</h3>
                </div>
            </div>

            <h2>📦 Daftar Produk Aktif</h2>
            <div class="product-list-admin" id="productListAdmin">
                <!-- Dynamic Items -->
            </div>
        </div>

    </div>

    <script>
        let imgSourceType = 'url';
        let vidSourceType = 'yt';

        // Toggle Input Mode Gambar
        function switchImgInput(type) {
            imgSourceType = type;
            const btnUrl = document.getElementById('btnImgUrl');
            const btnFile = document.getElementById('btnImgFile');
            const inputUrl = document.getElementById('gambarUrl');
            const inputFile = document.getElementById('gambarFile');

            if (type === 'url') {
                btnUrl.classList.add('active');
                btnFile.classList.remove('active');
                inputUrl.style.display = 'block';
                inputFile.style.display = 'none';
            } else {
                btnFile.classList.add('active');
                btnUrl.classList.remove('active');
                inputFile.style.display = 'block';
                inputUrl.style.display = 'none';
            }
        }

        // Toggle Input Mode Video
        function switchVidInput(type) {
            vidSourceType = type;
            const btnYt = document.getElementById('btnVidYt');
            const btnFile = document.getElementById('btnVidFile');
            const inputYt = document.getElementById('ytVideo');
            const inputFile = document.getElementById('videoFile');

            if (type === 'yt') {
                btnYt.classList.add('active');
                btnFile.classList.remove('active');
                inputYt.style.display = 'block';
                inputFile.style.display = 'none';
            } else {
                btnFile.classList.add('active');
                btnYt.classList.remove('active');
                inputFile.style.display = 'block';
                inputYt.style.display = 'none';
            }
        }

        // Helper function: Convert YouTube URL to Embed URL
        function formatYouTubeEmbedUrl(url) {
            if (!url) return '';
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
            const match = url.match(regExp);

            if (match && match[2].length === 11) {
                return `https://www.youtube.com/embed/${match[2]}`;
            } else if (url.trim().length === 11) {
                return `https://www.youtube.com/embed/${url.trim()}`;
            }
            return url;
        }

        // Helper function: Read File as Data URL (Base64)
        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        // Data Storage
        let products = JSON.parse(localStorage.getItem('gadgetProducts')) || [
            {
                id: 1,
                nama: "Smartphone Premium X",
                harga: 12000000,
                deskripsi: "Layar AMOLED 120Hz, RAM 12GB, Chipset Octa-Core, Kamera 108MP.",
                gambar: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500",
                gambarType: "url",
                ytVideo: "https://www.youtube.com/embed/L_LUpnjgPso",
                videoType: "yt"
            },
            {
                id: 2,
                nama: "Laptop Ultra Book Pro",
                harga: 18500000,
                deskripsi: "Layar 14 Retina 120Hz, RAM 16GB SSD 512GB, Baterai Tahan 18 Jam.",
                gambar: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=500",
                gambarType: "url",
                ytVideo: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                videoType: "yt"
            }
        ];

        function renderAdminProducts() {
            const container = document.getElementById('productListAdmin');
            const countElem = document.getElementById('totalProductsCount');
            container.innerHTML = '';
            countElem.innerText = products.length;

            products.forEach((p) => {
                const item = document.createElement('div');
                item.className = 'product-item-admin';
                item.innerHTML = `
                    <img src="${p.gambar || 'https://via.placeholder.com/150'}" alt="${p.nama}">
                    <div class="info">
                        <h4>${p.nama}</h4>
                        <p>Rp ${Number(p.harga).toLocaleString('id-ID')}</p>
                    </div>
                    <div class="action-btns">
                        <button class="btn-edit" onclick="startEditProduct(${p.id})">Edit</button>
                        <button class="btn-delete" onclick="deleteProduct(${p.id})">Hapus</button>
                    </div>
                `;
                container.appendChild(item);
            });

            localStorage.setItem('gadgetProducts', JSON.stringify(products));
        }

        async function handleFormSubmit(event) {
            event.preventDefault();

            const editId = document.getElementById('editProductId').value;
            const nama = document.getElementById('nama').value;
            const harga = Number(document.getElementById('harga').value);
            const deskripsi = document.getElementById('deskripsi').value;

            // Handle Gambar
            let gambarFinal = '';
            if (imgSourceType === 'file') {
                const fileInput = document.getElementById('gambarFile');
                if (fileInput.files && fileInput.files[0]) {
                    gambarFinal = await readFileAsBase64(fileInput.files[0]);
                } else if (editId) {
                    const existing = products.find(p => p.id == editId);
                    gambarFinal = existing ? existing.gambar : '';
                }
            } else {
                gambarFinal = document.getElementById('gambarUrl').value;
            }

            // Handle Video
            let videoFinal = '';
            if (vidSourceType === 'file') {
                const videoFileInput = document.getElementById('videoFile');
                if (videoFileInput.files && videoFileInput.files[0]) {
                    videoFinal = await readFileAsBase64(videoFileInput.files[0]);
                } else if (editId) {
                    const existing = products.find(p => p.id == editId);
                    videoFinal = existing ? existing.ytVideo : '';
                }
            } else {
                videoFinal = formatYouTubeEmbedUrl(document.getElementById('ytVideo').value);
            }

            if (editId) {
                // Update Produk Exsisting
                const idx = products.findIndex(p => p.id == editId);
                if (idx !== -1) {
                    products[idx] = {
                        ...products[idx],
                        nama,
                        harga,
                        deskripsi,
                        gambar: gambarFinal || products[idx].gambar,
                        gambarType: imgSourceType,
                        ytVideo: videoFinal || products[idx].ytVideo,
                        videoType: vidSourceType
                    };
                    alert('Produk berhasil diperbarui!');
                }
            } else {
                // Tambah Produk Baru
                const newProd = {
                    id: Date.now(),
                    nama,
                    harga,
                    deskripsi,
                    gambar: gambarFinal || 'https://via.placeholder.com/300',
                    gambarType: imgSourceType,
                    ytVideo: videoFinal,
                    videoType: vidSourceType
                };
                products.push(newProd);
                alert('Produk berhasil ditambahkan!');
            }

            resetFormState();
            renderAdminProducts();
        }

        function startEditProduct(id) {
            const product = products.find(p => p.id == id);
            if (!product) return;

            document.getElementById('editProductId').value = product.id;
            document.getElementById('nama').value = product.nama;
            document.getElementById('harga').value = product.harga;
            document.getElementById('deskripsi').value = product.deskripsi;

            // Set Mode Gambar
            if (product.gambarType === 'file') {
                switchImgInput('file');
            } else {
                switchImgInput('url');
                document.getElementById('gambarUrl').value = product.gambar || '';
            }

            // Set Mode Video
            if (product.videoType === 'file') {
                switchVidInput('file');
            } else {
                switchVidInput('yt');
                document.getElementById('ytVideo').value = product.ytVideo || '';
            }

            // Ubah UI Form ke Mode Edit
            document.getElementById('formTitle').querySelector('span').innerText = '✏️ Edit Produk';
            document.getElementById('editBadge').style.display = 'inline-block';
            document.getElementById('submitBtn').innerHTML = '🔄 Perbarui Data Produk';
            document.getElementById('cancelEditBtn').style.display = 'block';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetFormState() {
            document.getElementById('addProductForm').reset();
            document.getElementById('editProductId').value = '';
            document.getElementById('formTitle').querySelector('span').innerText = '➕ Tambah Produk Baru';
            document.getElementById('editBadge').style.display = 'none';
            document.getElementById('submitBtn').innerHTML = '💾 Simpan Produk ke Database';
            document.getElementById('cancelEditBtn').style.display = 'none';

            switchImgInput('url');
            switchVidInput('yt');
        }

        function deleteProduct(id) {
            if (confirm('Yakin ingin menghapus produk ini?')) {
                products = products.filter(p => p.id != id);
                renderAdminProducts();
            }
        }

        // Initial Render
        renderAdminProducts();
    </script>
</body>
</html>
