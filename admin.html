<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetStore Pro - Admin Panel</title>
    <!-- Import Google Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #06b6d4;
            --bg-dark: #090d16;
            --card-bg: rgba(18, 24, 38, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        html, body {
            width: 100%;
            max-width: 100vw;
            background: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.12) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-light);
            overflow-x: hidden;
        }

        body {
            padding: 12px;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* HEADER RESPONSIVE */
        header {
            background: rgba(30, 27, 75, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 14px 18px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: slideDown 0.5s ease-out;
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-badge {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            font-size: 0.65rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 10px rgba(236, 72, 153, 0.4);
            animation: pulseGlow 2s infinite alternate;
        }

        .btn-logout {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        }

        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.4);
        }

        .btn-logout:active {
            transform: scale(0.96);
        }

        /* CONTAINER GRID LAYOUT */
        .container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        @media (min-width: 768px) {
            .container {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
            header h1 { font-size: 1.3rem; }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 18px;
            border: 1px solid var(--card-border);
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            transition: transform 0.3s ease, border-color 0.3s ease;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:hover {
            border-color: rgba(99, 102, 241, 0.3);
        }

        .card h2 {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 14px;
            color: var(--accent);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group {
            margin-bottom: 12px;
            width: 100%;
        }

        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .form-group input, 
        .form-group textarea, 
        .form-group select {
            width: 100%;
            max-width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(11, 15, 25, 0.7);
            color: #fff;
            outline: none;
            font-size: 0.85rem;
            display: block;
            transition: all 0.25s ease;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
            background: rgba(11, 15, 25, 0.9);
        }

        .upload-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        input[type="file"] {
            font-size: 0.75rem;
            color: var(--text-muted);
            width: 100%;
            padding: 8px;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
            filter: brightness(1.1);
        }

        .btn-submit:active { transform: scale(0.98); }

        .btn-cancel {
            width: 100%;
            padding: 10px;
            background: rgba(100, 116, 139, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            display: none;
            transition: all 0.2s ease;
        }

        .btn-cancel:hover { background: rgba(100, 116, 139, 0.5); }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-box {
            background: rgba(11, 15, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            transform: translateY(-3px);
            border-color: rgba(56, 189, 248, 0.3);
            background: rgba(11, 15, 25, 0.8);
        }

        .stat-box h3 {
            font-size: 1.4rem;
            font-weight: 800;
            color: #38bdf8;
            margin-top: 2px;
        }

        .stat-box p {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .product-list-admin {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .product-list-admin::-webkit-scrollbar {
            width: 5px;
        }
        .product-list-admin::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
        }

        .product-item-admin {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(11, 15, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 10px;
            transition: all 0.25s ease;
        }

        .product-item-admin:hover {
            background: rgba(11, 15, 25, 0.9);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateX(4px);
        }

        .product-item-admin img {
            width: 44px;
            height: 44px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .product-item-admin .info {
            flex: 1;
            min-width: 0;
        }

        .product-item-admin .info h4 {
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-item-admin .info p {
            font-size: 0.78rem;
            color: var(--success);
            font-weight: 700;
        }

        .action-btns {
            display: flex;
            gap: 6px;
        }

        .btn-edit, .btn-delete {
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 700;
            color: #fff;
            transition: all 0.2s ease;
        }

        .btn-edit { 
            background: var(--warning); 
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.25);
        }
        .btn-edit:hover { background: #d97706; transform: scale(1.05); }

        .btn-delete { 
            background: var(--danger); 
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.25);
        }
        .btn-delete:hover { background: #dc2626; transform: scale(1.05); }

        /* TABEL SCROLL KHUSUS PERANGKAT HP */
        .order-table-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .order-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 580px;
        }

        .order-table th, .order-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 0.78rem;
        }

        .order-table th {
            color: var(--accent);
            background: rgba(11, 15, 25, 0.9);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.7rem;
        }

        .status-select {
            padding: 5px 8px;
            border-radius: 6px;
            background: rgba(11, 15, 25, 0.9);
            color: #38bdf8;
            border: 1px solid var(--primary);
            font-size: 0.72rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .payment-badge {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            font-size: 0.7rem;
            font-weight: 700;
            display: inline-block;
        }

        /* KEYFRAME ANIMATIONS */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 8px rgba(236, 72, 153, 0.4); }
            100% { box-shadow: 0 0 16px rgba(236, 72, 153, 0.8); }
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ GadgetStore <span class="admin-badge">Admin</span></h1>
        <button class="btn-logout" onclick="window.location.href='index.html'">Logout</button>
    </header>

    <div class="container">
        
        <!-- Form Tambah / Edit Produk -->
        <div class="card">
            <h2 id="formTitle">➕ Tambah Produk Baru</h2>
            <form id="productForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="editProductId">
                
                <div class="form-group">
                    <label for="nama">Nama Produk</label>
                    <input type="text" id="nama" placeholder="Contoh: iPad Pro M2" required>
                </div>
                
                <div class="form-group">
                    <label for="harga">Harga Produk (Rp)</label>
                    <input type="number" id="harga" placeholder="15000000" required>
                </div>
                
                <div class="form-group">
                    <label for="deskripsi">Deskripsi Singkat</label>
                    <textarea id="deskripsi" rows="2" placeholder="Spesifikasi & Detail" required></textarea>
                </div>
                
                <!-- Upload Gambar -->
                <div class="form-group">
                    <label>Gambar Produk</label>
                    <div class="upload-options">
                        <input type="text" id="gambarUrl" placeholder="Link/URL Gambar">
                        <input type="file" id="gambarFile" accept="image/*" onchange="convertFileToBase64('gambarFile', 'gambarUrl')">
                    </div>
                </div>

                <!-- Upload Video Demo -->
                <div class="form-group">
                    <label>Video Demo Produk</label>
                    <div class="upload-options">
                        <input type="text" id="ytVideoUrl" placeholder="Link YouTube / Embed">
                        <input type="file" id="ytVideoFile" accept="video/*" onchange="convertFileToBase64('ytVideoFile', 'ytVideoUrl')">
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">Simpan Produk</button>
                <button type="button" class="btn-cancel" id="btnCancel" onclick="resetForm()">Batal Edit</button>
            </form>
        </div>

        <!-- Dashboard Analytics & Inventaris -->
        <div class="card">
            <h2>📊 Analytics & Inventaris</h2>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <p>Total Produk</p>
                    <h3 id="totalProductsCount">0</h3>
                </div>
                <div class="stat-box">
                    <p>Total Pesanan</p>
                    <h3 id="totalOrdersCount" style="color: #ec4899;">0</h3>
                </div>
            </div>

            <h2>📦 Daftar Produk Aktif</h2>
            <div class="product-list-admin" id="productListAdmin"></div>
        </div>

        <!-- Kelola Status Pengiriman & Pembayaran -->
        <div class="card" style="grid-column: 1 / -1;">
            <h2>🚚 Kelola Pengiriman & Pembayaran Customer</h2>
            <div class="order-table-wrapper">
                <table class="order-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Pembeli</th>
                            <th>Tanggal</th>
                            <th>Barang</th>
                            <th>Total</th>
                            <th>Metode Bayar</th>
                            <th>Status Pengiriman</th>
                        </tr>
                    </thead>
                    <tbody id="adminOrdersBody"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        function convertFileToBase64(fileInputId, targetUrlInputId) {
            const fileInput = document.getElementById(fileInputId);
            const targetInput = document.getElementById(targetUrlInputId);
            
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    targetInput.value = e.target.result;
                };
                reader.readAsDataURL(fileInput.files[0]);
            }
        }

        function formatYouTubeEmbedUrl(url) {
            if (!url) return '';
            if (url.startsWith('data:video/')) return url;

            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
            const match = url.match(regExp);

            if (match && match[2].length === 11) {
                return `https://www.youtube.com/embed/${match[2]}`;
            }
            return url;
        }

        let products = JSON.parse(localStorage.getItem('gadgetProducts')) || [
            {
                id: 1,
                nama: "Smartphone Premium X",
                harga: 12000000,
                deskripsi: "Layar AMOLED 120Hz, RAM 12GB, Chipset Octa-Core, Kamera 108MP.",
                gambar: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500",
                ytVideo: "https://www.youtube.com/embed/L_LUpnjgPso"
            },
            {
                id: 2,
                nama: "Laptop Ultra Book Pro",
                harga: 18500000,
                deskripsi: "Layar 14 Retina 120Hz, RAM 16GB SSD 512GB, Baterai Tahan 18 Jam.",
                gambar: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=500",
                ytVideo: "https://www.youtube.com/embed/dQw4w9WgXcQ"
            }
        ];

        let orders = JSON.parse(localStorage.getItem('gadgetOrders')) || [];

        function renderAdminProducts() {
            const container = document.getElementById('productListAdmin');
            const countElem = document.getElementById('totalProductsCount');
            container.innerHTML = '';
            countElem.innerText = products.length;

            products.forEach((p, index) => {
                const item = document.createElement('div');
                item.className = 'product-item-admin';
                item.innerHTML = `
                    <img src="${p.gambar}" alt="${p.nama}">
                    <div class="info">
                        <h4>${p.nama}</h4>
                        <p>Rp ${Number(p.harga).toLocaleString('id-ID')}</p>
                    </div>
                    <div class="action-btns">
                        <button class="btn-edit" onclick="editProduct(${p.id})">Edit</button>
                        <button class="btn-delete" onclick="deleteProduct(${index})">Hapus</button>
                    </div>
                `;
                container.appendChild(item);
            });

            localStorage.setItem('gadgetProducts', JSON.stringify(products));
        }

        function renderAdminOrders() {
            const tbody = document.getElementById('adminOrdersBody');
            const orderCountElem = document.getElementById('totalOrdersCount');
            tbody.innerHTML = '';
            orderCountElem.innerText = orders.length;

            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#94a3b8; padding:20px;">Belum ada pesanan masuk.</td></tr>`;
                return;
            }

            orders.forEach((ord, index) => {
                const itemsSummary = ord.items.map(i => `${i.nama} (${i.qty}x)`).join(', ');
                const paymentMethod = ord.paymentMethod || ord.metodePembayaran || 'Transfer Bank';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>#${ord.id}</strong></td>
                    <td>${ord.buyerName}</td>
                    <td>${ord.date}</td>
                    <td>${itemsSummary}</td>
                    <td style="color:#10b981; font-weight:bold;">Rp ${Number(ord.total).toLocaleString('id-ID')}</td>
                    <td><span class="payment-badge">💳 ${paymentMethod}</span></td>
                    <td>
                        <select class="status-select" onchange="updateOrderStatus(${index}, this.value)">
                            <option value="Sedang Diproses" ${ord.status === 'Sedang Diproses' ? 'selected' : ''}>⏳ Diproses</option>
                            <option value="Dalam Perjalanan" ${ord.status === 'Dalam Perjalanan' ? 'selected' : ''}>🚚 Perjalanan</option>
                            <option value="Sudah Sampai" ${ord.status === 'Sudah Sampai' ? 'selected' : ''}>✅ Sampai</option>
                            <option value="Selesai" ${ord.status === 'Selesai' ? 'selected' : ''}>🎉 Selesai</option>
                        </select>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateOrderStatus(index, newStatus) {
            orders[index].status = newStatus;
            localStorage.setItem('gadgetOrders', JSON.stringify(orders));
            alert(`Status pesanan #${orders[index].id} diperbarui: ${newStatus}`);
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            
            const editId = document.getElementById('editProductId').value;
            let videoInput = document.getElementById('ytVideoUrl').value;
            videoInput = formatYouTubeEmbedUrl(videoInput);

            const productData = {
                id: editId ? Number(editId) : Date.now(),
                nama: document.getElementById('nama').value,
                harga: Number(document.getElementById('harga').value),
                deskripsi: document.getElementById('deskripsi').value,
                gambar: document.getElementById('gambarUrl').value || 'https://via.placeholder.com/300',
                ytVideo: videoInput
            };

            if (editId) {
                const index = products.findIndex(p => p.id === Number(editId));
                if (index !== -1) {
                    products[index] = productData;
                    alert('Produk berhasil diperbarui!');
                }
            } else {
                products.push(productData);
                alert('Produk baru berhasil ditambahkan!');
            }

            renderAdminProducts();
            resetForm();
        }

        function editProduct(id) {
            const prod = products.find(p => p.id === id);
            if (!prod) return;

            document.getElementById('editProductId').value = prod.id;
            document.getElementById('nama').value = prod.nama;
            document.getElementById('harga').value = prod.harga;
            document.getElementById('deskripsi').value = prod.deskripsi;
            document.getElementById('gambarUrl').value = prod.gambar;
            document.getElementById('ytVideoUrl').value = prod.ytVideo;

            document.getElementById('formTitle').innerText = '✏️ Edit Produk';
            document.getElementById('btnSubmit').innerText = 'Update Produk';
            document.getElementById('btnCancel').style.display = 'block';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('productForm').reset();
            document.getElementById('editProductId').value = '';
            document.getElementById('gambarFile').value = '';
            document.getElementById('ytVideoFile').value = '';
            document.getElementById('formTitle').innerText = '➕ Tambah Produk Baru';
            document.getElementById('btnSubmit').innerText = 'Simpan Produk';
            document.getElementById('btnCancel').style.display = 'none';
        }

        function deleteProduct(index) {
            if(confirm('Yakin ingin menghapus produk ini?')) {
                products.splice(index, 1);
                renderAdminProducts();
            }
        }

        renderAdminProducts();
        renderAdminOrders();
    </script>
</body>
</html>
