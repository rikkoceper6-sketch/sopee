<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetStore Pro - Katalog Pembeli</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #4f46e5;
            --accent: #2563eb;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-body);
            color: var(--text-dark);
            padding-bottom: 50px;
        }

        header {
            position: sticky;
            top: 0;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(12px);
            color: #fff;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        header h1 { font-size: 1.25rem; font-weight: 800; color: #38bdf8; }

        .header-actions { display: flex; gap: 10px; }

        .btn-header {
            background: #1e293b;
            color: #fff;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.82rem;
            font-weight: 600;
        }

        .cart-badge {
            background: #ef4444;
            color: white;
            font-size: 0.7rem;
            padding: 2px 7px;
            border-radius: 10px;
        }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 16px; }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 24px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 18px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .product-card:hover { transform: translateY(-4px); }

        .product-card img { width: 100%; height: 170px; object-fit: cover; }

        .product-card .card-body { padding: 14px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            padding: 24px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-modal {
            position: absolute;
            top: 14px; right: 18px;
            font-size: 1.8rem;
            cursor: pointer;
            color: #64748b;
        }

        /* FORM NAMA PEMBELI & PENERIMA */
        .form-checkout-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
            text-align: left;
        }

        .form-checkout-group label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 2px;
            display: block;
        }

        .form-checkout-group input, .form-checkout-group select {
            width: 100%;
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 0.85rem;
            outline: none;
        }

        .btn-checkout {
            width: 100%;
            padding: 12px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
        }

        .order-card-buyer {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 0.83rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>🛍️ GadgetStore</h1>
        <div class="header-actions">
            <button class="btn-header" onclick="openStatusModal()">📦 Status Pesanan</button>
            <button class="btn-header" onclick="openCartModal()">🛒 Keranjang <span class="cart-badge" id="cartCount">0</span></button>
        </div>
    </header>

    <div class="container">
        <div class="top-section">
            <h2>Katalog Produk Gadget</h2>
        </div>
        <div class="product-grid" id="buyerProductGrid"></div>
    </div>

    <!-- MODAL KERANJANG & CHECKOUT -->
    <div class="modal-overlay" id="cartModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeCartModal()">&times;</span>
            <h2 style="font-size:1.2rem; font-weight:800;">🛒 Keranjang Belanja</h2>
            
            <div id="cartItemsList" style="margin-top: 12px;"></div>

            <!-- INPUT NAMA PEMBELI DAN NAMA PENERIMA -->
            <div class="form-checkout-group" id="checkoutFields">
                <div>
                    <label for="buyerNameInput">👤 Nama Pemesan / Pembeli</label>
                    <input type="text" id="buyerNameInput" placeholder="Masukkan nama Anda (Pembeli)">
                </div>

                <div>
                    <label for="recipientNameInput">🎁 Nama Penerima Barang</label>
                    <input type="text" id="recipientNameInput" placeholder="Masukkan nama penerima paket">
                </div>

                <div>
                    <label for="recipientPhoneInput">📞 Nomor HP Penerima</label>
                    <input type="text" id="recipientPhoneInput" placeholder="Contoh: 08123456789">
                </div>

                <div>
                    <label for="recipientAddressInput">📍 Alamat Pengiriman LKP</label>
                    <input type="text" id="recipientAddressInput" placeholder="Jl. Mawar No. 12, Kota ...">
                </div>

                <div>
                    <label for="paymentMethodInput">💳 Metode Pembayaran</label>
                    <select id="paymentMethodInput">
                        <option value="COD (Bayar di Tempat)">💵 COD (Bayar di Tempat)</option>
                        <option value="Transfer Bank">🏦 Transfer Bank</option>
                        <option value="E-Wallet / QRIS">📱 E-Wallet / QRIS</option>
                    </select>
                </div>
            </div>

            <div style="font-size: 1.1rem; font-weight: 800; text-align: right; margin-top: 15px;" id="cartTotalText">Total: Rp 0</div>
            <button class="btn-checkout" onclick="checkout()">Konfirmasi & Pesan Sekarang</button>
        </div>
    </div>

    <!-- MODAL STATUS PESANAN -->
    <div class="modal-overlay" id="statusModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeStatusModal()">&times;</span>
            <h2 style="font-size:1.2rem; font-weight:800; margin-bottom:12px;">📦 Status Pengiriman Barang</h2>
            <div id="buyerOrdersList"></div>
        </div>
    </div>

    <script>
        let products = JSON.parse(localStorage.getItem('gadgetProducts')) || [];
        let cart = JSON.parse(localStorage.getItem('buyerCart')) || [];

        function renderBuyerProducts() {
            const grid = document.getElementById('buyerProductGrid');
            grid.innerHTML = '';

            if (products.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #64748b;">Belum ada produk tersedia.</p>`;
                return;
            }

            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => addToCart(p);
                card.innerHTML = `
                    <img src="${p.gambar}" alt="${p.nama}">
                    <div class="card-body">
                        <h3>${p.nama}</h3>
                        <div style="font-weight:800; color:var(--accent); margin-top:6px;">Rp ${Number(p.harga).toLocaleString('id-ID')}</div>
                        <p style="font-size:0.75rem; color:#64748b; margin-top:4px;">+ Klik untuk tambah ke keranjang</p>
                    </div>
                `;
                grid.appendChild(card);
            });

            updateCartBadge();
        }

        function addToCart(p) {
            const existing = cart.find(item => item.id === p.id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ id: p.id, nama: p.nama, harga: p.harga, qty: 1 });
            }
            localStorage.setItem('buyerCart', JSON.stringify(cart));
            updateCartBadge();
            alert(`Berhasil menambahkan ${p.nama} ke keranjang!`);
        }

        function updateCartBadge() {
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cartCount').innerText = totalQty;
        }

        function openCartModal() {
            const cartList = document.getElementById('cartItemsList');
            const checkoutFields = document.getElementById('checkoutFields');
            cartList.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                cartList.innerHTML = '<p style="color:#64748b; text-align:center;">Keranjang Anda kosong.</p>';
                checkoutFields.style.display = 'none';
            } else {
                checkoutFields.style.display = 'flex';
                cart.forEach(item => {
                    const subtotal = item.harga * item.qty;
                    total += subtotal;
                    const div = document.createElement('div');
                    div.style.display = 'flex';
                    div.style.justifyContent = 'space-between';
                    div.style.padding = '6px 0';
                    div.style.borderBottom = '1px solid #f1f5f9';
                    div.innerHTML = `
                        <span>${item.nama} (${item.qty}x)</span>
                        <strong>Rp ${Number(subtotal).toLocaleString('id-ID')}</strong>
                    `;
                    cartList.appendChild(div);
                });
            }

            document.getElementById('cartTotalText').innerText = 'Total: Rp ' + Number(total).toLocaleString('id-ID');
            document.getElementById('cartModal').style.display = 'flex';
        }

        function closeCartModal() { document.getElementById('cartModal').style.display = 'none'; }

        function checkout() {
            if (cart.length === 0) {
                alert('Keranjang belanja kosong!');
                return;
            }

            const buyerName = document.getElementById('buyerNameInput').value.trim();
            const recipientName = document.getElementById('recipientNameInput').value.trim();
            const phone = document.getElementById('recipientPhoneInput').value.trim();
            const address = document.getElementById('recipientAddressInput').value.trim();
            const pMethod = document.getElementById('paymentMethodInput').value;

            if (!buyerName || !recipientName) {
                alert('Mohon isi nama pembeli dan nama penerima!');
                return;
            }

            const orders = JSON.parse(localStorage.getItem('gadgetOrders')) || [];
            const totalAmount = cart.reduce((sum, item) => sum + (item.harga * item.qty), 0);

            const newOrder = {
                id: Math.floor(100000 + Math.random() * 900000),
                buyerName: buyerName,
                recipientName: recipientName,
                phone: phone,
                address: address,
                date: new Date().toLocaleDateString('id-ID'),
                items: [...cart],
                total: totalAmount,
                paymentMethod: pMethod,
                status: 'Sedang Diproses'
            };

            orders.push(newOrder);
            localStorage.setItem('gadgetOrders', JSON.stringify(orders));

            alert(`Pesanan #${newOrder.id} Berhasil!\nPembeli: ${buyerName}\nPenerima: ${recipientName}`);

            cart = [];
            localStorage.removeItem('buyerCart');
            updateCartBadge();
            closeCartModal();
        }

        function openStatusModal() {
            const container = document.getElementById('buyerOrdersList');
            container.innerHTML = '';

            const orders = JSON.parse(localStorage.getItem('gadgetOrders')) || [];

            if (orders.length === 0) {
                container.innerHTML = '<p style="color:#64748b; text-align:center;">Belum ada pesanan.</p>';
            } else {
                orders.forEach(ord => {
                    const itemsText = ord.items.map(i => `${i.nama} (${i.qty}x)`).join(', ');
                    const div = document.createElement('div');
                    div.className = 'order-card-buyer';
                    div.innerHTML = `
                        <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                            <strong>Order #${ord.id}</strong>
                            <span style="color:#2563eb; font-weight:700;">${ord.status}</span>
                        </div>
                        <div>👤 Pembeli: <strong>${ord.buyerName}</strong></div>
                        <div>🎁 Penerima: <strong>${ord.recipientName}</strong> (${ord.phone || '-'})</div>
                        <div>📍 Alamat: ${ord.address || '-'}</div>
                        <div>📦 Barang: ${itemsText}</div>
                        <div style="margin-top:4px; font-weight:800; color:#10b981;">Total: Rp ${Number(ord.total).toLocaleString('id-ID')}</div>
                    `;
                    container.appendChild(div);
                });
            }

            document.getElementById('statusModal').style.display = 'flex';
        }

        function closeStatusModal() { document.getElementById('statusModal').style.display = 'none'; }

        renderBuyerProducts();
    </script>
</body>
</html>
